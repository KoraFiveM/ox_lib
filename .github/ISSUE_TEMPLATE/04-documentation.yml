name: Documentation Issue
description: Report missing, outdated or unclear documentation for ox_lib.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in ox_lib
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Legacy imports, Callbacks and points, UI bridge, Locale and
      notifications.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
